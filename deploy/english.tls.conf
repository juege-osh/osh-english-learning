server {
 listen 443 ssl http2;
 server_name english.osh.lol;
 ssl_certificate /www/server/panel/vhost/cert/english.osh.lol/fullchain.pem;
 ssl_certificate_key /www/server/panel/vhost/cert/english.osh.lol/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 gzip on;
 gzip_types text/css application/javascript application/json;
 gzip_min_length 512;
 location / {
  proxy_pass http://127.0.0.1:18887;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_read_timeout 30s;
 }
}
